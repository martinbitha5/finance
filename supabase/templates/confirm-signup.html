<!-- Modèle Supabase « Confirm signup » (Authentication → Emails → Templates). Sujet conseillé : Active ton compte MONY -->
<div style="margin:0;padding:32px 16px;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:480px;background:#ffffff;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="padding:32px 32px 8px;text-align:center;">
              <div style="font-size:28px;font-weight:800;letter-spacing:-0.5px;">MONY</div>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 0;text-align:center;">
              <h1 style="margin:0;font-size:22px;font-weight:700;">Bienvenue sur MONY 👋</h1>
              <p style="margin:12px 0 0;font-size:15px;line-height:1.5;color:#4b5563;">
                Il ne reste qu'une étape : confirme ton adresse e-mail pour activer ton compte.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px;text-align:center;">
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block;padding:14px 28px;background:#111827;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;border-radius:12px;">
                Activer mon compte
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 32px;text-align:center;">
              <p style="margin:0;font-size:13px;line-height:1.5;color:#6b7280;">
                Le bouton ne fonctionne pas ? Copie ce lien dans ton navigateur :<br>
                <a href="{{ .ConfirmationURL }}" style="color:#111827;word-break:break-all;">{{ .ConfirmationURL }}</a>
              </p>
              <p style="margin:20px 0 0;font-size:12px;line-height:1.5;color:#9ca3af;">
                Tu n'as pas créé de compte MONY ? Ignore simplement cet e-mail.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
